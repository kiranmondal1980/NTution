# NSE MOMENTUM 5™ — Streamlit Production UI & Server Configuration (Light Theme)

[theme]
primaryColor = "#00897b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#111111"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
