# NSE MOMENTUM 5™ — Streamlit Production UI & Server Configuration

[theme]
primaryColor = "#00e676"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1e29"
textColor = "#ffffff"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
