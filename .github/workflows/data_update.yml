# ==============================================================================
# NSE MOMENTUM 5™ — Scheduled / Manual Data Sync Workflow
# ==============================================================================
# NOTE: Configured for workflow_dispatch (manual trigger) to respect rate limits
# and data provider terms of service. Avoids aggressive automated scraping.
# ==============================================================================

name: Market Data Ingestion Sync

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Calendar days of historical OHLCV data to download'
        required: true
        default: '365'

jobs:
  sync_market_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Historical Data Ingestion Script
        run: |
          python scripts/download_data.py --days ${{ github.event.inputs.lookback_days }}
